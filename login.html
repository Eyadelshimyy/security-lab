<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-visual">
            <h2>Enter the Vulnerable Zone</h2>
            <p>A deliberately breakable login system, built to learn how attacks actually work.</p>
            <div class="steps">
                <div class="step active">
                    <div class="step-number">1</div>
                    Submit raw, unvalidated credentials
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    Query built with unsafe string concatenation
                </div>
            </div>
        </div>

        <div class="auth-form">
            <h1>Log In</h1>
            <p>Enter your credentials to access your account.</p>

            <form action="login.php" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="eg. John" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <p class="switch-link">Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
