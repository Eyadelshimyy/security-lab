<!DOCTYPE html>
<html>
<head>
    <title>Security Lab</title>
    <link rel="stylesheet" href="auth-style.css">
    <style>
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }
        .landing::before,
        .landing::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .landing::before {
            width: 640px;
            height: 640px;
            top: -220px;
            right: -160px;
            background: radial-gradient(circle, rgba(79, 174, 148, 0.3) 0%, rgba(79, 174, 148, 0) 70%);
            animation: drift 22s ease-in-out infinite;
        }
        .landing::after {
            width: 560px;
            height: 560px;
            bottom: -220px;
            left: -160px;
            background: radial-gradient(circle, rgba(45, 106, 95, 0.24) 0%, rgba(45, 106, 95, 0) 70%);
            animation: drift 26s ease-in-out infinite reverse;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 40px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .landing::before, .landing::after { animation: none; }
        }
        .landing .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 0.6s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .landing .logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(160deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 24px;
            box-shadow: 0 0 40px -6px var(--accent);
        }
        .landing h1 {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .landing p {
            font-size: 16px;
            color: var(--text-dim);
            max-width: 480px;
            margin-bottom: 32px;
        }
        .landing .cta {
            display: flex;
            gap: 16px;
        }
        .landing .cta a {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            font-size: 15px;
            transition: box-shadow 0.25s ease, background-color 0.25s ease, transform 0.15s ease;
        }
        .landing .cta a:active {
            transform: scale(0.97);
        }
        .landing .cta .primary {
            background: white;
            color: #111;
        }
        .landing .cta .primary:hover {
            background: #eee;
            box-shadow: 0 0 30px -8px rgba(255, 255, 255, 0.5);
        }
        .landing .cta .secondary {
            background: var(--surface);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid var(--border);
        }
        .landing .cta .secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-strong);
            box-shadow: 0 0 22px -6px var(--accent);
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="content">
            <div class="logo">L</div>
            <h1>Security Lab</h1>
            <p>Track your habits, finances, and learning goals in one dashboard &mdash; built from scratch as a hands-on lab for learning full-stack web security.</p>
            <div class="cta">
                <a href="login.html" class="primary">Log In</a>
                <a href="register.html" class="secondary">Sign Up</a>
            </div>
        </div>
    </div>
</body>
</html>
